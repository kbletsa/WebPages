<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επεξεργασία Εργασίας</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 60%;
            max-width: 800px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 0;
        }
        
        form {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 5px;
        }
        
        input[type="text"],
        input[type="date"],
        textarea,
        input[type="file"] {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        button {
            background-color: #393fe1;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Επεξεργασία Εργασίας</h1>
        </div>
        <div class="main-content">
            <form>
                <label for="assignment-title">Τίτλος Εργασίας:</label>
                <input type="text" id="assignment-title" name="title" required><br><br>

                <label for="objectives">Στόχοι:</label><br>
                <textarea id="objectives" name="objectives" rows="4" cols="50" required></textarea><br><br>

                <label for="deliverables">Παραδοτέα:</label><br>
                <textarea id="deliverables" name="deliverables" rows="4" cols="50" required></textarea><br><br>

                <label for="due-date">Ημερομηνία Παράδοσης:</label>
                <input type="date" id="due-date" name="due_date" required><br><br>

                <label for="file">Αρχείο Εκφώνησης (PDF/Word):</label>
                <input type="file" id="file" name="file" accept=".pdf, .doc, .docx" required><br><br>

                <button type="submit">Αποθήκευση Εργασίας</button>
            </form>
        </div>
    </div>
</body>

</html>
